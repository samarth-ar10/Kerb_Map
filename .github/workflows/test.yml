name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r query/requirements.txt
      - name: Compile
        run: python -m compileall -q common query dashcam streetcam weave_eval
      - name: Test
        env:
          KERB_DB: local
          KERB_EMBEDDER: hash
        run: python -m pytest -q common/tests query/tests
      - name: Check the deploy bundle
        run: python query/build_deploy.py --backend local
