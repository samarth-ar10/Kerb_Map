# Kerb Map app on the team cluster (starter-kit pattern: public python image, code from a ConfigMap,
# credentials from a Secret, Ingress at /app with the prefix stripped). No secrets in this file:
# the ConfigMap `kerbmap-app-code` and the Secret `kerbmap-app-vss-creds` are created by command
# (see query/DEPLOY.md). Apply with: kubectl -n team-5 apply -f deploy/k8s/kerbmap-app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kerbmap-app
  labels:
    app: kerbmap-app
spec:
  replicas: 1   # labelling batch locks live in process memory; keep one replica
  selector:
    matchLabels:
      app: kerbmap-app
  template:
    metadata:
      labels:
        app: kerbmap-app
    spec:
      containers:
      - name: app
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: KERB_DB
          value: "vastdb"
        - name: VSS_URL
          valueFrom: {secretKeyRef: {name: kerbmap-app-vss-creds, key: VSS_URL}}
        - name: VSS_USERNAME
          valueFrom: {secretKeyRef: {name: kerbmap-app-vss-creds, key: VSS_USERNAME}}
        - name: VSS_PASSWORD
          valueFrom: {secretKeyRef: {name: kerbmap-app-vss-creds, key: VSS_PASSWORD}}
        - name: S3_ENDPOINT
          valueFrom: {secretKeyRef: {name: kerbmap-app-vss-creds, key: S3_ENDPOINT}}
        - name: ACCESS_KEY
          valueFrom: {secretKeyRef: {name: kerbmap-app-vss-creds, key: ACCESS_KEY}}
        - name: SECRET_KEY
          valueFrom: {secretKeyRef: {name: kerbmap-app-vss-creds, key: SECRET_KEY}}
        - name: VASTDB_BUCKET
          valueFrom: {secretKeyRef: {name: kerbmap-app-vss-creds, key: VASTDB_BUCKET}}
        - name: GPU_BEARER_TOKEN
          valueFrom: {secretKeyRef: {name: kerbmap-app-vss-creds, key: GPU_BEARER_TOKEN, optional: true}}
        volumeMounts:
        - name: code
          mountPath: /code
        workingDir: /code
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            pip install --no-cache-dir -q -r requirements.txt
          fi
          exec python main.py
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: code
        configMap:
          name: kerbmap-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: kerbmap-app
  labels:
    app: kerbmap-app
spec:
  selector:
    app: kerbmap-app
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kerbmap-app
  labels:
    app: kerbmap-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: video-lab-team-5.cosmos.vastdata.com
    http:
      paths:
      - path: /app(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: kerbmap-app
            port:
              number: 80
