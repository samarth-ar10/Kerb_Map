<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neighborhood_cam-1 kerb</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 14px/1.4 sans-serif; }
  #wrap { position: relative; display: inline-block; }
  canvas { display: block; max-width: 100vw; height: auto; }
  #legend { padding: 8px 12px; }
  .swatch { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
<div id="legend"></div>
<div id="wrap">
  <canvas id="c"></canvas>
</div>
<script>
const COLORS = {
  near: "rgba(255, 210, 0, 0.45)",
  far: "rgba(0, 220, 160, 0.45)",
  driveway: "rgba(230, 60, 40, 0.35)",
  lane: "rgba(40, 90, 255, 0.28)"
};
const img = new Image();
img.src = "frame_neighborhood.jpg";
img.onload = async () => {
  const kerb = await (await fetch("kerb_neighborhood.json")).json();
  const canvas = document.getElementById("c");
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const g = canvas.getContext("2d");
  g.drawImage(img, 0, 0);
  const draw = (poly, color, label) => {
    g.beginPath();
    poly.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
    g.closePath();
    g.fillStyle = color;
    g.fill();
    g.strokeStyle = color.replace("0.45", "1").replace("0.35", "1").replace("0.28", "1");
    g.lineWidth = 3;
    g.stroke();
    if (label) {
      g.fillStyle = "#fff";
      g.font = "28px sans-serif";
      g.fillText(label, poly[0][0] + 8, poly[0][1] + 28);
    }
  };
  draw(kerb.lane.polygon, COLORS.lane, "lane");
  for (const strip of kerb.kerb_strips) draw(strip.polygon, COLORS[strip.id] || COLORS.near, strip.id);
  for (const d of kerb.driveways) draw(d.polygon, COLORS.driveway, "driveway " + d.id);
  const legend = document.getElementById("legend");
  legend.textContent = kerb.frame.filename + "  frame " + kerb.frame.frame_index
    + "  ·  near kerb, far kerb, two driveways, lane";
};
</script>
</body>
</html>
