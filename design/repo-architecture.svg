<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1240" viewBox="0 0 1040 1240">
  <rect width="1040" height="1240" fill="#f4f3ef"/>
  <text x="36" y="48" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#15181c">Repo architecture</text>
  <text x="36" y="76" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4a525b">The folders that read VSS, write the six tables, and answer a pin.</text>

  <!-- VSS -->
  <rect x="36" y="100" width="968" height="132" rx="16" fill="#15181c"/>
  <text x="56" y="132" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f4f3ef">VSS library</text>
  <text x="56" y="156" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c8cdd3">Pipelines read boxes already stored. They do not re-run YOLO.</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="56" y="174" width="150" height="36" rx="8" fill="#2a3038"/>
    <text x="72" y="197" fill="#f4f3ef">videos/explore</text>
    <rect x="218" y="174" width="180" height="36" rx="8" fill="#2a3038"/>
    <text x="234" y="197" fill="#f4f3ef">videos/detections</text>
    <rect x="410" y="174" width="150" height="36" rx="8" fill="#2a3038"/>
    <text x="426" y="197" fill="#f4f3ef">videos/stream</text>
    <rect x="572" y="174" width="200" height="36" rx="8" fill="#2a3038"/>
    <text x="588" y="197" fill="#f4f3ef">dashboard/reingest</text>
  </g>

  <line x1="520" y1="232" x2="520" y2="258" stroke="#15181c" stroke-width="2"/>

  <!-- data -->
  <rect x="36" y="258" width="220" height="360" rx="16" fill="#ffffff" stroke="#d5d2cb" stroke-width="1"/>
  <text x="52" y="290" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#15181c">data/</text>
  <text x="52" y="318" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">Place for every segment.</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#15181c">
    <text x="52" y="360">pie_segments.csv</text>
    <text x="52" y="384">pie_map.csv</text>
    <text x="52" y="408">video_geo.csv</text>
  </g>
  <text x="52" y="456" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">PIE GPS for the dashcam.</text>
  <text x="52" y="478" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">One geo row per street</text>
  <text x="52" y="500" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">camera segment.</text>

  <!-- dashcam -->
  <rect x="272" y="258" width="360" height="360" rx="16" fill="#ffffff" stroke="#cc79a7" stroke-width="2"/>
  <rect x="272" y="258" width="8" height="360" rx="2" fill="#cc79a7"/>
  <text x="296" y="290" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#15181c">dashcam/</text>
  <text x="296" y="314" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">pie_cam-3, Toronto. receipts.py</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#15181c">
    <text x="296" y="348">clips.py  keyframes.py  boxes.py</text>
    <text x="296" y="376">gate</text>
    <text x="296" y="400">boxes</text>
    <text x="296" y="424">geometry  slots.py</text>
    <text x="296" y="448">rule      rules.py  osm_fetch.py</text>
    <text x="296" y="472">cosmos    cosmos_check.py</text>
    <text x="296" y="496">position  from PIE GPS</text>
  </g>
  <text x="296" y="540" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">convert_teammate.py writes pr_ ids.</text>
  <text x="296" y="564" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">JSONL in dashcam/out/.</text>

  <!-- streetcam -->
  <rect x="648" y="258" width="356" height="360" rx="16" fill="#ffffff" stroke="#009e73" stroke-width="2"/>
  <rect x="996" y="258" width="8" height="360" rx="2" fill="#009e73"/>
  <text x="668" y="290" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#15181c">streetcam/</text>
  <text x="668" y="314" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">Three fixed cameras.</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#15181c">
    <text x="668" y="348">fetch_detections.py</text>
    <text x="668" y="372">tracker.py</text>
    <text x="668" y="396">parked.py</text>
    <text x="668" y="420">geo.py  apply_geo.py</text>
    <text x="668" y="444">write_receipts.py</text>
  </g>
  <text x="668" y="484" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">Kerb drawn once per camera:</text>
  <text x="668" y="508" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#15181c">kerb_neighborhood.json</text>
  <text x="668" y="532" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#15181c">kerb_sf.json  kerb_nyc.json</text>
  <text x="668" y="568" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">JSONL in streetcam/out/.</text>

  <line x1="520" y1="618" x2="520" y2="644" stroke="#15181c" stroke-width="2"/>

  <!-- common -->
  <rect x="36" y="644" width="968" height="168" rx="16" fill="#ffffff" stroke="#15181c" stroke-width="2"/>
  <text x="56" y="678" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#15181c">common/</text>
  <text x="160" y="678" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4a525b">kerb_schema.py defines the rows. kerbdb.py is the only writer.</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#15181c">
    <text x="56" y="714">kerb_spaces</text>
    <text x="210" y="714">kerb_observations</text>
    <text x="420" y="714">kerb_trail</text>
    <text x="560" y="714">kerb_overrules</text>
    <text x="740" y="714">kerb_eval_cases</text>
    <text x="56" y="742">kerb_cameras</text>
  </g>
  <text x="56" y="782" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c">VastDB schema kerbmap, or SQLite at $KERB_SQLITE. Unknown fields are rejected.</text>

  <line x1="520" y1="812" x2="520" y2="838" stroke="#15181c" stroke-width="2"/>

  <!-- query -->
  <rect x="36" y="838" width="968" height="210" rx="16" fill="#ffffff" stroke="#0072b2" stroke-width="2"/>
  <text x="56" y="872" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0072b2">query/</text>
  <text x="140" y="872" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4a525b">A pin is a filter, then a radius, then a rank.</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#15181c">
    <text x="56" y="910">sources.py</text>
    <text x="200" y="910">store.py</text>
    <text x="320" y="910">search.py</text>
    <text x="450" y="910">api.py</text>
    <text x="56" y="940">labels.py</text>
    <text x="180" y="940">replay.py</text>
    <text x="310" y="940">evidence.py</text>
    <text x="460" y="940">timeline.py</text>
    <text x="610" y="940">mcp_server.py</text>
    <text x="770" y="940">second_agent.py</text>
  </g>
  <text x="56" y="978" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c">sources.py reads dashcam/out and streetcam/out. On the same key the database row wins.</text>
  <text x="56" y="1006" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#15181c">api.py serves the pages. mcp_server.py exposes find, receipt, and overrule. second_agent.py calls them.</text>

  <line x1="520" y1="1048" x2="520" y2="1074" stroke="#15181c" stroke-width="2"/>

  <!-- deploy -->
  <rect x="36" y="1074" width="968" height="120" rx="16" fill="#15181c"/>
  <text x="56" y="1110" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f2c230">deploy/</text>
  <text x="56" y="1140" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#f4f3ef">query/build_deploy.py flattens the app into deploy/app.</text>
  <text x="56" y="1166" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c8cdd3">ConfigMap kerbmap-app-code. Ingress path /app on the team host.</text>
</svg>
