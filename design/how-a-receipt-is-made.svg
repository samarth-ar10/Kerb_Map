<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <rect width="1600" height="860" fill="#f4f3ef"/>
  <text x="48" y="64" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#15181c">How a receipt is made</text>
  <text x="48" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#4a525b">Both cameras read boxes VSS already stored. Neither re-runs YOLO.</text>
  <g>
    <rect x="48" y="116" width="18" height="8" fill="#15181c"/>
    <rect x="66" y="116" width="18" height="8" fill="#f2c230"/>
    <rect x="84" y="116" width="18" height="8" fill="#15181c"/>
    <rect x="102" y="116" width="18" height="8" fill="#f2c230"/>
    <rect x="120" y="116" width="18" height="8" fill="#15181c"/>
    <rect x="138" y="116" width="18" height="8" fill="#f2c230"/>
  </g>

  <defs>
    <clipPath id="lib"><rect x="48" y="156" width="300" height="640" rx="20"/></clipPath>
  </defs>
  <!-- library -->
  <g clip-path="url(#lib)">
    <rect x="48" y="156" width="300" height="640" fill="#ffffff"/>
    <rect x="48" y="156" width="10" height="640" fill="#15181c"/>
    <text x="76" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a525b">1</text>
    <text x="100" y="212" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#15181c">Library</text>
    <text x="76" y="248" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#15181c">VSS footage</text>
    <text x="76" y="274" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4a525b">612 chunks, 30 seconds each.</text>
    <text x="76" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4a525b">Toronto drives and three</text>
    <text x="76" y="318" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4a525b">fixed street cameras.</text>

    <rect x="76" y="352" width="244" height="72" rx="12" fill="#f4f3ef"/>
    <text x="96" y="382" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15181c">Explore</text>
    <text x="96" y="404" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">which clip, which camera</text>

    <rect x="76" y="436" width="244" height="72" rx="12" fill="#f4f3ef"/>
    <text x="96" y="466" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15181c">Detections</text>
    <text x="96" y="488" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">a box on every frame</text>

    <rect x="76" y="520" width="244" height="72" rx="12" fill="#f4f3ef"/>
    <text x="96" y="550" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15181c">Stream</text>
    <text x="96" y="572" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">the frame, for evidence</text>

    <text x="76" y="640" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">YOLO11, confidence at least 0.4.</text>
    <text x="76" y="662" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">No track ids in the sidecar.</text>
    <text x="76" y="700" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15181c">No GPS in the index.</text>
    <text x="76" y="724" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">Pins come from PIE files,</text>
    <text x="76" y="746" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">or from a camera we place.</text>
  </g>

  <path d="M364 470 H392" stroke="#15181c" stroke-width="2" fill="none"/>
  <path d="M384 462 L396 470 L384 478" stroke="#15181c" stroke-width="2" fill="none"/>

  <defs>
    <clipPath id="dash"><rect x="412" y="156" width="700" height="300" rx="20"/></clipPath>
    <clipPath id="street"><rect x="412" y="476" width="700" height="320" rx="20"/></clipPath>
  </defs>

  <!-- pipelines -->
  <g clip-path="url(#dash)">
    <rect x="412" y="156" width="700" height="300" fill="#ffffff"/>
    <rect x="412" y="156" width="10" height="300" fill="#cc79a7"/>
    <text x="452" y="204" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#cc79a7">2</text>
    <text x="476" y="204" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#15181c">Dashcam</text>
    <text x="452" y="234" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4a525b">pie_cam-3, six Toronto drives, one keyframe about every 8 m</text>

    <g font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15181c">
      <rect x="452" y="262" width="190" height="44" rx="12" fill="#f8e8f1"/>
      <text x="472" y="290">Gate, every 8 m</text>
      <rect x="658" y="262" width="190" height="44" rx="12" fill="#f8e8f1"/>
      <text x="678" y="290">Stored boxes</text>
      <rect x="864" y="262" width="210" height="44" rx="12" fill="#f8e8f1"/>
      <text x="884" y="290">Kerb geometry</text>

      <rect x="452" y="322" width="190" height="44" rx="12" fill="#f8e8f1"/>
      <text x="472" y="350">OpenStreetMap</text>
      <rect x="658" y="322" width="190" height="44" rx="12" fill="#f8e8f1"/>
      <text x="678" y="350">Cosmos, if open</text>
      <rect x="864" y="322" width="210" height="44" rx="12" fill="#f8e8f1"/>
      <text x="884" y="350">GPS pin</text>
    </g>
    <text x="452" y="404" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">Cosmos runs only on gaps the rules leave open. Side is L or R.</text>
    <text x="452" y="428" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">position_status is ok when the PIE GPS is there.</text>
  </g>

  <g clip-path="url(#street)">
    <rect x="412" y="476" width="700" height="320" fill="#ffffff"/>
    <rect x="412" y="476" width="10" height="320" fill="#009e73"/>
    <text x="452" y="524" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#009e73">3</text>
    <text x="476" y="524" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#15181c">Street camera</text>
    <text x="452" y="554" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4a525b">Neighbourhood, Broadway &amp; Columbus, Broadway &amp; Walker</text>

    <g font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15181c">
      <rect x="452" y="582" width="200" height="44" rx="12" fill="#e5f6f1"/>
      <text x="472" y="610">Track the day</text>
      <rect x="668" y="582" width="200" height="44" rx="12" fill="#e5f6f1"/>
      <text x="688" y="610">Kerb drawn once</text>
      <rect x="884" y="582" width="190" height="44" rx="12" fill="#e5f6f1"/>
      <text x="904" y="610">Still 120 s</text>

      <rect x="452" y="642" width="200" height="44" rx="12" fill="#e5f6f1"/>
      <text x="472" y="670">On the kerb strip</text>
      <rect x="668" y="642" width="200" height="44" rx="12" fill="#e5f6f1"/>
      <text x="688" y="670">Map, under 2 m</text>
      <rect x="884" y="642" width="190" height="44" rx="12" fill="#e5f6f1"/>
      <text x="904" y="670">Else uncertain</text>
    </g>
    <text x="452" y="728" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">One row per stretch, every 10 seconds. Side is view.</text>
    <text x="452" y="752" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">A car at a red light is not parked. Parked means still, and on the kerb.</text>
  </g>

  <path d="M1128 470 H1160" stroke="#15181c" stroke-width="2" fill="none"/>
  <path d="M1152 462 L1164 470 L1152 478" stroke="#15181c" stroke-width="2" fill="none"/>

  <!-- kept and asked -->
  <g>
    <rect x="1180" y="156" width="372" height="400" rx="20" fill="#ffffff"/>
    <text x="1208" y="204" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0072b2">4</text>
    <text x="1232" y="204" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#15181c">Same tables</text>
    <text x="1208" y="234" font-family="Menlo, monospace" font-size="14" fill="#4a525b">common/kerbdb.py</text>

    <g font-family="Menlo, monospace" font-size="14" fill="#15181c">
      <text x="1208" y="278">kerb_spaces</text>
      <text x="1208" y="306">kerb_observations</text>
      <text x="1208" y="334">kerb_trail</text>
      <text x="1208" y="362">kerb_overrules</text>
      <text x="1208" y="390">kerb_eval_cases</text>
      <text x="1208" y="418">kerb_cameras</text>
    </g>
    <text x="1208" y="470" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">VastDB schema kerbmap,</text>
    <text x="1208" y="492" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">or local SQLite.</text>
    <text x="1208" y="522" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">JSONL in each out/ folder</text>
  </g>

  <g>
    <rect x="1180" y="576" width="372" height="220" rx="20" fill="#0072b2"/>
    <rect x="1208" y="608" width="36" height="36" rx="8" fill="#ffffff"/>
    <text x="1226" y="633" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0072b2">P</text>
    <text x="1256" y="634" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Pin query</text>
    <text x="1208" y="678" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d6ebf8">Filter, then a radius.</text>
    <text x="1208" y="706" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d6ebf8">Receipt, search, labels, replay.</text>
    <text x="1208" y="748" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">A newer sighting of the same metres wins.</text>
  </g>
</svg>
