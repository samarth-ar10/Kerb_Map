<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <rect width="1600" height="640" fill="#f4f3ef"/>
  <text x="48" y="60" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#15181c">What a receipt holds</text>
  <text x="48" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#4a525b">One stretch of kerb. A state, a position, a time, and the steps that decided it.</text>

  <!-- receipt card -->
  <g>
    <rect x="48" y="128" width="760" height="464" rx="20" fill="#ffffff"/>
    <g clip-path="url(#cardclip)">
      <rect x="48" y="128" width="190" height="10" fill="#15181c"/>
      <rect x="238" y="128" width="190" height="10" fill="#f2c230"/>
      <rect x="428" y="128" width="190" height="10" fill="#15181c"/>
      <rect x="618" y="128" width="190" height="10" fill="#f2c230"/>
    </g>
    <rect x="72" y="164" width="44" height="44" rx="10" fill="#0072b2"/>
    <text x="94" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">P</text>
    <text x="132" y="186" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#15181c">Left kerb, one car length</text>
    <text x="132" y="210" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4a525b">dashcam or street camera</text>

    <rect x="72" y="240" width="92" height="36" rx="8" fill="#0072b2"/>
    <text x="118" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">free</text>
    <rect x="176" y="240" width="118" height="36" rx="8" fill="#d55e00"/>
    <text x="235" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">occupied</text>
    <rect x="306" y="240" width="124" height="36" rx="8" fill="#5b6168"/>
    <text x="368" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">not a space</text>
    <rect x="442" y="240" width="140" height="36" rx="8" fill="#e69f00"/>
    <text x="512" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1300">cannot tell</text>

    <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#15181c">
      <text x="72" y="324" fill="#4a525b">Side</text>
      <text x="220" y="324">L, R, or the whole view</text>
      <text x="72" y="360" fill="#4a525b">Length</text>
      <text x="220" y="360">about 5.5 m for one car</text>
      <text x="72" y="396" fill="#4a525b">Position</text>
      <text x="220" y="396">ok, or uncertain</text>
      <text x="72" y="432" fill="#4a525b">Last seen</text>
      <text x="220" y="432">when this sighting was made</text>
      <text x="72" y="468" fill="#4a525b">Evidence</text>
      <text x="220" y="468">a frame, not the whole video</text>
    </g>

    <text x="72" y="524" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a525b">The trail records only the steps that ran.</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15181c">
      <rect x="72" y="544" width="70" height="28" rx="6" fill="#f4f3ef"/>
      <text x="107" y="563" text-anchor="middle">gate</text>
      <rect x="150" y="544" width="74" height="28" rx="6" fill="#f4f3ef"/>
      <text x="187" y="563" text-anchor="middle">boxes</text>
      <rect x="232" y="544" width="96" height="28" rx="6" fill="#f4f3ef"/>
      <text x="280" y="563" text-anchor="middle">geometry</text>
      <rect x="336" y="544" width="64" height="28" rx="6" fill="#f4f3ef"/>
      <text x="368" y="563" text-anchor="middle">rule</text>
      <rect x="408" y="544" width="84" height="28" rx="6" fill="#f4f3ef"/>
      <text x="450" y="563" text-anchor="middle">cosmos</text>
      <rect x="500" y="544" width="70" height="28" rx="6" fill="#f4f3ef"/>
      <text x="535" y="563" text-anchor="middle">track</text>
      <rect x="578" y="544" width="92" height="28" rx="6" fill="#f4f3ef"/>
      <text x="624" y="563" text-anchor="middle">position</text>
      <rect x="678" y="544" width="98" height="28" rx="6" fill="#f4f3ef"/>
      <text x="727" y="563" text-anchor="middle">overrule</text>
    </g>
  </g>
  <defs>
    <clipPath id="cardclip"><rect x="48" y="128" width="760" height="464" rx="20"/></clipPath>
  </defs>

  <!-- rules -->
  <g>
    <rect x="836" y="128" width="716" height="140" rx="20" fill="#ffffff"/>
    <rect x="864" y="160" width="18" height="18" rx="4" fill="#0072b2"/>
    <text x="900" y="176" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#15181c">Free</text>
    <text x="864" y="214" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#15181c">Legal, seen, and empty for about one car.</text>
    <text x="864" y="240" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4a525b">Unseen kerb stays unknown. Unknown is not empty.</text>

    <rect x="836" y="288" width="716" height="140" rx="20" fill="#ffffff"/>
    <rect x="864" y="320" width="18" height="18" rx="4" fill="#f2c230"/>
    <text x="900" y="336" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#15181c">Freshness</text>
    <text x="864" y="374" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#15181c">A newer sighting of the same metres wins.</text>
    <text x="864" y="400" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4a525b">Street cameras keep one stretch live. Dashcams cover other roads, then go stale.</text>

    <rect x="836" y="448" width="716" height="144" rx="20" fill="#ffffff"/>
    <rect x="864" y="480" width="18" height="18" rx="4" fill="#15181c"/>
    <text x="900" y="496" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#15181c">Where it is</text>
    <text x="864" y="534" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#15181c">ok only when the check is under 2 m.</text>
    <text x="864" y="560" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4a525b">Otherwise the row says position uncertain, and keeps the last honest coordinate.</text>
  </g>
</svg>
